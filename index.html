<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e0f7fa; /* Latar belakang cyan muda */
            min-height: 100vh;
        }

        /* Banner Atas */
        .header-banner {
            background-color: #1b8a5a; /* Hijau banner */
            padding: 40px 20px;
            text-align: center;
        }

        .header-banner h1 {
            color: #ff5722; /* Oranye teks "Profil Saya" */
            font-size: 3rem;
            font-weight: bold;
        }

        /* Bar Selamat Datang */
        .welcome-bar {
            background-color: #00e5ff; /* Cyan terang */
            color: #ff5722; /* Oranye teks "Selamat Datang" */
            text-align: right;
            padding: 6px 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Konten Utama */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            padding: 20px;
        }

        /* Foto Profil Melingkar */
        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Kartu Biodata */
        .info-card {
            background-color: #90caf9; /* Biru muda melengkung */
            border-radius: 35px;
            padding: 25px 40px;
            width: 380px;
            color: #1a237e; /* Biru tua teks */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 10px 5px;
            font-size: 0.95rem;
            vertical-align: top;
        }

        .info-table td:first-child {
            width: 35%;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="header-banner">
        <h1>Profil Saya</h1>
    </div>

    <!-- Running/Welcome Bar -->
    <div class="welcome-bar">
        Selamat Datang
    </div>

    <!-- Content -->
    <div class="container">
        <!-- Foto Profil -->
        <img src="https://via.placeholder.com/170" alt="Foto Profil" class="profile-img">

        <!-- Kartu Informasi -->
        <div class="info-card">
            <table class="info-table">
                <tr>
                    <td>Nama</td>
                    <td>Yusup Miftahuddin</td>
                </tr>
                <tr>
                    <td>Alamat</td>
                    <td>Jalan Cingised</td>
                </tr>
                <tr>
                    <td>Asal Kota</td>
                    <td>Bandung</td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>yusufm@itenas.ac.id</td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
